<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Navigation Error</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #1c1d24 0%, #0f1016 45%, #050608 100%);
        color: #f9fafb;
      }

      main {
        padding: 40px;
        border-radius: 20px;
        background: rgba(17, 25, 40, 0.85);
        border: 1px solid rgba(93, 93, 125, 0.2);
        max-width: 560px;
        width: calc(100% - 32px);
        box-shadow: 0 24px 60px rgba(5, 8, 15, 0.55);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 2rem;
      }

      p {
        margin-top: 0;
        margin-bottom: 16px;
        line-height: 1.6;
        color: rgba(226, 232, 240, 0.88);
      }

      code {
        background: rgba(79, 70, 229, 0.18);
        border-radius: 6px;
        padding: 2px 6px;
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
        font-size: 0.95rem;
      }

      a {
        color: #818cf8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Navigation Failed</h1>
      <p id="error-summary">An unexpected error occurred.</p>
      <p id="error-link-container">
        Requested URL:
        <a id="error-link" href="#" rel="noreferrer noopener">unknown</a>
      </p>
      <p>Please review the URL in the control panel and try navigating again.</p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const description = params.get('description') || 'Unknown navigation error';
      const failedUrl = params.get('url') || '';

      const summary = code ? `Error ${code}: ${description}` : description;
      document.getElementById('error-summary').textContent = summary;

      const link = document.getElementById('error-link');
      if (failedUrl) {
        link.textContent = failedUrl;
        link.title = failedUrl;
        link.href = failedUrl;
      } else {
        link.textContent = 'unknown';
        link.removeAttribute('href');
      }
    </script>
  </body>
</html>
