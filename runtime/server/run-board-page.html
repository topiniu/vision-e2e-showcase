<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vision E2E 运行看板</title>
<style>
  :root {
    --bg: #fcfcfb; --surface: #ffffff; --surface-2: #f3f3f1; --border: #e3e3df;
    --ink: #1b1b19; --ink-2: #4a4a46; --ink-3: #7a7a74;
    --accent: #2f6fe4; --good: #0ca30c; --critical: #d03b3b; --warning: #fab219; --neutral: #8a8a86;
    --good-text: #006300; --critical-text: #b42626;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --border: #2f2f2c;
    --ink: #f1f1ee; --ink-2: #c3c3be; --ink-3: #8c8c86;
    --accent: #5b93f5; --good-text: #4cc94c; --critical-text: #f07272;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  header .meta { color: var(--ink-3); font-size: 12px; }
  header .spacer { flex: 1; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--neutral); }
  .dot.live { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .clock { font-family: var(--mono); font-size: 16px; color: var(--ink-2); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--ink-2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  button.ghost:hover { border-color: var(--ink-3); }
  main { padding: 20px 24px 40px; display: grid; gap: 20px; }
  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi .label { color: var(--ink-3); font-size: 12px; }
  .kpi .value { font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .sub { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  section.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  section.panel > h2 { margin: 0; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  h2 .count { color: var(--ink-3); font-weight: 500; }
  .empty { padding: 28px 16px; text-align: center; color: var(--ink-3); }
  .run { padding: 14px 16px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
  .run:last-child { border-bottom: 0; }
  .run .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .run .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .run .elapsed { font-family: var(--mono); color: var(--ink-2); font-size: 13px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 11px; border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
  .badge.kind { background: var(--surface-2); }
  .badge.running { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .badge.passed { color: var(--good-text); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
  .badge.failed { color: var(--critical-text); border-color: color-mix(in srgb, var(--critical) 45%, transparent); }
  .badge.other { color: var(--ink-2); }
  .badge.queued { color: var(--ink-2); border-color: color-mix(in srgb, var(--warning) 55%, transparent); }
  .spin { width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; display: flex; gap: 2px; }
  .bar span { height: 100%; }
  .bar .p { background: var(--good); } .bar .f { background: var(--critical); } .bar .r { background: var(--accent); opacity: .55; }
  .run .line { color: var(--ink-2); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; min-width: 0; }
  .run .line .k { color: var(--ink-3); }
  .run .step { font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run .fail { color: var(--critical-text); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); min-width: 0; }
  .queue-row:last-child { border-bottom: 0; }
  .queue-row .pos { font-family: var(--mono); color: var(--ink-3); width: 28px; text-align: right; }
  .queue-row .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .queue-row .wait { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
  .chart-wrap { padding: 12px 16px 8px; position: relative; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); padding: 0 16px 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  svg text { fill: var(--ink-3); font-size: 11px; }
  .tooltip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 12px; color: var(--ink); white-space: nowrap; display: none; z-index: 3; }
  .filters { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .filters select, .filters input { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12px; }
  .filters input { min-width: 220px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--ink-3); font-weight: 500; font-size: 12px; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td .path { font-family: var(--mono); font-size: 11px; color: var(--ink-3); word-break: break-all; }
  td .failmsg { color: var(--critical-text); font-size: 12px; max-width: 420px; }
  .table-scroll { max-height: 560px; overflow: auto; }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, 1fr); } .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Vision E2E 运行看板</h1>
  <span class="meta" id="host"></span>
  <span class="spacer"></span>
  <span class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">连接中…</span></span>
  <span class="clock" id="clock"></span>
  <button class="ghost" id="theme" type="button" aria-label="切换浅色/深色">浅色</button>
</header>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="grid-2">
    <section class="panel" data-testid="run-board-live">
      <h2>正在运行 <span class="count" id="live-count"></span></h2>
      <div id="live"></div>
    </section>
    <div style="display:grid;gap:20px">
      <section class="panel" data-testid="run-board-queued">
        <h2>排队中 <span class="count" id="queued-count"></span></h2>
        <div id="queued"></div>
      </section>
      <section class="panel">
        <h2>近 24 小时完成量</h2>
        <div class="chart-wrap" id="chart"><div class="tooltip" id="tip"></div></div>
        <div class="legend">
          <span><i style="background:var(--good)"></i>通过</span>
          <span><i style="background:var(--critical)"></i>失败</span>
          <span><i style="background:var(--neutral)"></i>阻断 / 取消 / 其他</span>
        </div>
      </section>
    </div>
  </div>
  <section class="panel" data-testid="run-board-history">
    <h2>运行历史 <span class="count" id="history-count"></span></h2>
    <div class="filters" id="history-scope">统计与图表基于最近 300 条历史记录，非全量汇总。</div>
    <div class="filters">
      <select id="f-status" aria-label="按状态筛选">
        <option value="">全部状态</option>
        <option value="passed">通过</option>
        <option value="failed">失败</option>
        <option value="blocked">阻断</option>
        <option value="cancelled">取消</option>
      </select>
      <select id="f-kind" aria-label="按类型筛选"><option value="">全部类型</option></select>
      <input id="f-text" type="search" placeholder="搜索测试文件 / 会话 ID / 失败信息" aria-label="搜索运行历史" />
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>状态</th><th>类型</th><th>测试文件</th><th>用例</th><th>耗时</th><th>排队</th><th>结束时间</th><th>首个失败</th></tr></thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
(() => {
  const STATUS_LABEL = { passed: "通过", failed: "失败", blocked: "阻断", cancelled: "取消", stopped: "已停止", timeout: "超时", error: "错误", running: "运行中", queued: "排队" };
  const TRIGGER_LABEL = { "test-sessions/batch": "HTTP 批量", "app-runs/batch": "App-run 批量", "panel-batch": "面板批量", panel: "面板", "app-runs": "App-run", mcp: "MCP" };
  const state = { kinds: {}, live: [], queued: [], history: [], stats: null, host: null };
  const $ = (id) => document.getElementById(id);
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const reportLabel = (value) => String(value).replaceAll("\\", "/").split("/output/").at(-1);
  const dur = (ms) => {
    if (!Number.isFinite(ms)) return "—";
    const s = Math.round(ms / 1000);
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ${String(s % 60).padStart(2, "0")}s`;
    return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
  };
  const time = (ts) => (ts ? new Date(ts).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) : "—");
  const statusClass = (s) => (s === "passed" ? "passed" : s === "failed" ? "failed" : s === "running" ? "running" : s === "queued" ? "queued" : "other");
  const statusBadge = (s) => `<span class="badge ${statusClass(s)}">${s === "running" ? '<span class="spin" aria-hidden="true"></span>' : s === "passed" ? "✓" : s === "failed" ? "✕" : "•"} ${esc(STATUS_LABEL[s] || s)}</span>`;
  const kindBadge = (k) => `<span class="badge kind">${esc(state.kinds[k] || k)}</span>`;
  const fileName = (entry) => entry.testFileName || (entry.testFilePath ? String(entry.testFilePath).split(/[\\/]/).pop() : entry.title);

  function renderKpis() {
    const s = state.stats || { running: 0, queued: 0, today: {} };
    const t = s.today || {};
    const tiles = [
      ["正在运行", state.live.length, "实时"],
      ["排队中", state.queued.length, "App-run 队列 + 批量池"],
      ["今日完成", t.finished ?? 0, `阻断 ${t.blocked ?? 0} · 取消 ${t.cancelled ?? 0}`],
      ["今日通过率", t.passRate == null ? "—" : `${Math.round(t.passRate * 100)}%`, `通过 ${t.passed ?? 0} / 失败 ${t.failed ?? 0}`],
      ["今日失败", t.failed ?? 0, "通过+失败计入通过率"],
      ["中位耗时", dur(t.medianDurationMs), "今日已完成"],
    ];
    $("kpis").innerHTML = tiles.map(([label, value, sub]) => `<div class="kpi"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="sub">${esc(sub)}</div></div>`).join("");
  }

  function renderLive() {
    $("live-count").textContent = state.live.length ? `${state.live.length}` : "";
    if (!state.live.length) {
      $("live").innerHTML = '<div class="empty">当前没有运行中的工作</div>';
      return;
    }
    const now = Date.now();
    $("live").innerHTML = state.live.map((entry) => {
      const p = entry.progress || {};
      const total = p.caseTotal || 0;
      const passed = p.casesPassed || 0;
      const failed = p.casesFailed || 0;
      const remaining = Math.max(0, total - passed - failed);
      const bar = total
        ? `<div class="bar" role="img" aria-label="用例进度 通过${passed} 失败${failed} 共${total}">${passed ? `<span class="p" style="flex:${passed}"></span>` : ""}${failed ? `<span class="f" style="flex:${failed}"></span>` : ""}${remaining ? `<span class="r" style="flex:${remaining};opacity:.18"></span>` : ""}</div>`
        : "";
      const step = p.step;
      const stepText = step
        ? `步骤 ${step.index != null ? step.index + 1 : "?"}${step.total ? `/${step.total}` : ""} · ${esc(step.actionType || "")} ${esc(step.title || "")}`
        : p.currentCase ? "准备中…" : "启动中…";
      const elapsed = entry.startedAt ? now - entry.startedAt : null;
      return `<div class="run">
        <div class="top">${statusBadge("running")}${kindBadge(entry.kind)}<span class="title" title="${esc(entry.testFilePath || entry.title)}">${esc(fileName(entry))}</span><span class="elapsed">${dur(elapsed)}</span></div>
        ${bar}
        <div class="line">
          <span><span class="k">用例</span> ${total ? `${passed + failed}/${total}` : "—"}${failed ? ` · <span style="color:var(--critical-text)">失败 ${failed}</span>` : ""}</span>
          <span><span class="k">当前</span> ${esc(p.currentCase?.name || "—")}</span>
          <span><span class="k">步骤</span> 通过 ${p.stepsPassed || 0} / 失败 ${p.stepsFailed || 0}</span>
          ${entry.trigger ? `<span><span class="k">来源</span> ${esc(TRIGGER_LABEL[entry.trigger] || entry.trigger)}</span>` : ""}
          ${entry.foreign ? `<span><span class="k">进程</span> ${esc(entry.host?.hostname || "")}#${esc(entry.host?.pid || "")}</span>` : ""}
        </div>
        <div class="step" title="${esc(step?.title || "")}">${stepText}</div>
        ${p.lastFailure ? `<div class="fail" title="${esc(p.lastFailure.message || "")}">✕ ${esc(p.lastFailure.title || "")} ${esc(p.lastFailure.code || "")} ${esc(p.lastFailure.message || "")}</div>` : ""}
        <div class="line" style="font-size:11px"><span class="k">ID</span> <span style="font-family:var(--mono)">${esc(entry.sessionId || entry.id)}</span></div>
      </div>`;
    }).join("");
  }

  function renderQueued() {
    $("queued-count").textContent = state.queued.length ? `${state.queued.length}` : "";
    if (!state.queued.length) {
      $("queued").innerHTML = '<div class="empty">没有排队中的工作</div>';
      return;
    }
    const now = Date.now();
    $("queued").innerHTML = state.queued.map((entry, index) => `<div class="queue-row">
      <span class="pos">#${index + 1}</span>
      ${kindBadge(entry.kind)}
      <span class="title" title="${esc(entry.testFilePath || entry.title)}">${esc(fileName(entry))}</span>
      <span class="wait">等待 ${dur(entry.queuedAt ? now - entry.queuedAt : null)}</span>
    </div>`).join("");
  }

  function renderChart() {
    const hourly = state.stats?.hourly || [];
    const host = $("chart");
    const width = Math.max(260, host.clientWidth - 32);
    const height = 150;
    const pad = { l: 26, r: 4, t: 8, b: 20 };
    const max = Math.max(1, ...hourly.map((h) => h.passed + h.failed + h.other));
    const bw = (width - pad.l - pad.r) / Math.max(1, hourly.length);
    const y = (v) => pad.t + (height - pad.t - pad.b) * (1 - v / max);
    let bars = "";
    hourly.forEach((h, i) => {
      const x = pad.l + i * bw + 1;
      const w = Math.max(2, bw - 2);
      let base = 0;
      const segs = [["passed", "var(--good)"], ["failed", "var(--critical)"], ["other", "var(--neutral)"]];
      const parts = [];
      for (const [key, color] of segs) {
        const v = h[key];
        if (!v) continue;
        const y1 = y(base + v);
        const y0 = y(base);
        parts.push(`<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(1, y0 - y1 - (base ? 2 : 0))}" rx="2" fill="${color}"/>`);
        base += v;
      }
      bars += `<g data-i="${i}">${parts.join("")}<rect class="hit" x="${pad.l + i * bw}" y="${pad.t}" width="${bw}" height="${height - pad.t - pad.b}" fill="transparent"/></g>`;
    });
    const ticks = [0, Math.ceil(max / 2), max].filter((v, i, a) => a.indexOf(v) === i);
    const grid = ticks.map((v) => `<line x1="${pad.l}" x2="${width - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("");
    const clockLabel = (ts) => new Date(ts).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
    const labels = hourly.map((h, i) => (i % 6 === 5 ? `<text x="${pad.l + i * bw + bw / 2}" y="${height - 4}" text-anchor="middle">${clockLabel(h.hourEnd)}</text>` : "")).join("");
    const svg = `<svg width="${width}" height="${height}" role="img" aria-label="近24小时每小时完成的运行数">${grid}${bars}${labels}</svg>`;
    host.querySelector("svg")?.remove();
    host.insertAdjacentHTML("beforeend", svg);
    const tip = $("tip");
    host.querySelectorAll("g[data-i]").forEach((g) => {
      g.addEventListener("mousemove", (event) => {
        const h = hourly[Number(g.dataset.i)];
        const end = new Date(h.hourEnd);
        const start = new Date(h.hourEnd - 3600000);
        tip.innerHTML = `${clockLabel(start)}–${clockLabel(end)}<br>通过 ${h.passed} · 失败 ${h.failed} · 其他 ${h.other}`;
        tip.style.display = "block";
        const rect = host.getBoundingClientRect();
        tip.style.left = `${Math.min(event.clientX - rect.left + 12, rect.width - 160)}px`;
        tip.style.top = `${event.clientY - rect.top - 10}px`;
      });
      g.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    });
  }

  function renderHistory() {
    const status = $("f-status").value;
    const kind = $("f-kind").value;
    const text = $("f-text").value.trim().toLowerCase();
    const rows = state.history.filter((item) => {
      if (status && (status === "cancelled" ? !["cancelled", "stopped"].includes(item.status) : item.status !== status)) return false;
      if (kind && item.kind !== kind) return false;
      if (text) {
        const hay = [item.testFilePath, item.testFileName, item.title, item.sessionId, item.id, item.firstFailure?.message, item.firstFailure?.code].join(" ").toLowerCase();
        if (!hay.includes(text)) return false;
      }
      return true;
    });
    $("history-count").textContent = `${rows.length} / ${state.history.length}`;
    $("history").innerHTML = rows.length
      ? rows.map((item) => `<tr>
          <td>${statusBadge(item.status)}</td>
          <td>${kindBadge(item.kind)}${item.trigger ? `<div class="path">${esc(TRIGGER_LABEL[item.trigger] || item.trigger)}</div>` : ""}</td>
          <td><div title="${esc(item.testFilePath || "")}">${esc(fileName(item))}</div><div class="path">${esc(item.sessionId || item.id)}</div></td>
          <td class="num">${item.casesTotal != null ? `${item.casesPassed ?? 0}/${item.casesTotal}` : "—"}${item.casesFailed ? ` <span style="color:var(--critical-text)">✕${item.casesFailed}</span>` : ""}</td>
          <td class="num">${dur(item.durationMs)}</td>
          <td class="num">${item.waitMs ? dur(item.waitMs) : "—"}</td>
          <td class="num">${time(item.finishedAt)}</td>
          <td>${item.firstFailure ? `<div class="failmsg">${esc([item.firstFailure.title, item.firstFailure.code].filter(Boolean).join(" · "))}</div><div class="path">${esc(item.firstFailure.message || "")}</div>` : item.failureType ? `<div class="failmsg">${esc(item.failureType)}</div>` : ""}${item.reportPath ? `<div class="path">${esc(reportLabel(item.reportPath))}</div>` : ""}</td>
        </tr>`).join("")
      : '<tr><td colspan="8" class="empty">没有符合条件的记录</td></tr>';
  }

  function renderKindsFilter() {
    const select = $("f-kind");
    const current = select.value;
    select.innerHTML = '<option value="">全部类型</option>' + Object.entries(state.kinds).map(([key, label]) => `<option value="${esc(key)}">${esc(label)}</option>`).join("");
    select.value = current;
  }

  function renderAll() {
    renderKpis();
    renderLive();
    renderQueued();
    renderChart();
    renderHistory();
  }

  async function loadFull() {
    try {
      const response = await fetch("/run-board/data?history=300", { cache: "no-store" });
      const body = await response.json();
      if (!body.ok) throw new Error(body.error?.message || "load failed");
      const data = body.data;
      state.kinds = data.kinds || {};
      state.live = data.live || [];
      state.queued = data.queued || [];
      state.history = data.history || [];
      state.stats = data.stats || null;
      state.host = data.host || null;
      $("host").textContent = state.host ? `${state.host.hostname} · pid ${state.host.pid}${state.host.servers?.length ? ` · ${state.host.servers.join(" / ")}` : ""}` : "";
      renderKindsFilter();
      renderAll();
    } catch (error) {
      $("conn-text").textContent = `加载失败：${error.message}`;
    }
  }

  let source = null;
  let fallbackTimer = null;
  function connect() {
    if (!window.EventSource) {
      fallbackTimer = setInterval(loadFull, 5000);
      return;
    }
    source = new EventSource("/run-board/events");
    source.addEventListener("open", () => {
      loadFull();
      $("conn-dot").classList.add("live");
      $("conn-text").textContent = "实时";
      if (fallbackTimer) { clearInterval(fallbackTimer); fallbackTimer = null; }
    });
    source.addEventListener("board", (event) => {
      const payload = JSON.parse(event.data);
      state.live = payload.live || [];
      state.queued = payload.queued || [];
      renderKpis();
      renderLive();
      renderQueued();
      if (payload.historyChanged) loadFull();
    });
    source.addEventListener("error", () => {
      $("conn-dot").classList.remove("live");
      $("conn-text").textContent = "已断开，轮询中…";
      if (!fallbackTimer) fallbackTimer = setInterval(loadFull, 5000);
    });
  }

  function tickClock() {
    $("clock").textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
    if (state.live.length || state.queued.length) { renderLive(); renderQueued(); }
  }

  const savedTheme = localStorage.getItem("zz-run-board-theme");
  const embeddedTheme = window.parent !== window ? new URLSearchParams(location.search).get("theme") : null;
  if (embeddedTheme === "light" || embeddedTheme === "dark") {
    document.documentElement.dataset.theme = embeddedTheme;
    $("theme").hidden = true;
  } else if (savedTheme === "light" || savedTheme === "dark") {
    document.documentElement.dataset.theme = savedTheme;
  }
  const syncThemeButton = () => { $("theme").textContent = document.documentElement.dataset.theme === "dark" ? "浅色" : "深色"; };
  syncThemeButton();
  $("theme").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("zz-run-board-theme", next);
    syncThemeButton();
  });
  ["f-status", "f-kind", "f-text"].forEach((id) => $(id).addEventListener("input", renderHistory));
  window.addEventListener("resize", renderChart);
  setInterval(tickClock, 1000);
  setInterval(loadFull, 60000);
  tickClock();
  loadFull().then(connect);
})();
</script>
</body>
</html>
